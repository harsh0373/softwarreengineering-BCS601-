{% extends "studentparent.html" %}
{% block body %}
<div class="row">
    <div class="col-sm-12 bg-primary p-2">
        <h1 style="text-align:center; ">Student Home</h1>

    </div>
</div>
<div class="row mt-2 fs-2">
   
</div>
<div class="row">
    <div class="col-4 p-1" style="margin-left: 30px;">
        <div class="text-dark fs-4 ">
            Student Information
        </div>
        <div class="text-dark fs-5 fw-light">
            Name : {{stu.name}}
        </div>
        <div class="text-dark fs-5 fw-light">
            Roll no : {{stu.rollno}}
        </div>
        <div class="text-dark fs-5 fw-light">
            Program : {{stu.program}}
        </div>
    </div>
    <div class="col-4 p-1" style="margin-left: 20px; margin-right: 20px;">
        <div class="text-dark fs-4  mb-3" style="width: 90%;">
           Mendatory Attandance
        </div>
        <div class="progress" style="width: 85%;">
            <div class="progress-bar p-2" role="progressbar" style="width: 75%" aria-valuenow="75" aria-valuemin="0"
                aria-valuemax="100">75%</div>
        </div>
    </div>
    <div class="col-3 p-2">
        <label for="datetime">Current Date and Time:</label>
        <input type="text" id="datetime" readonly>
    


    </div>
</div>
<script> function updateDateTime() {
    const now = new Date();
    const date = now.toLocaleDateString();
    const time = now.toLocaleTimeString();
    document.getElementById("datetime").value = date + " " + time;
}

setInterval(updateDateTime, 1000);
updateDateTime();</script>

{% endblock body %}
