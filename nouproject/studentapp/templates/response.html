{% extends "studentparent.html" %}
{% load static %}
{% block body %}
{% if messages %}
{% for msg in messages %}

<div class="alert alert-success alert-dismissible fade show" role="alert">
  <strong>Hey bro!</strong> {{msg}}
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

{% endfor %}


{% endif %}

<h1 style="text-align:center; color:white; background-color: #192f59;" class="">Submit Your Response Here</h1>
<div class="container mt-4  ">
    <div class="row " >
        <div class="col-6"><img src="{% static 'images/bgimg.png' %}" alt="" height="350vh" width="450vh"></div>
        <div class="col-6 mt-3 bg-light" >
            <form action="{% url 'studentapp:response' %}" class="form-group bg-light" method="post" >
                {% csrf_token %}
                <table class="table bg-light text-dark shadow rounded" style="width: 90%; margin: 0 auto;" >
                    <tr>
                        <td class="fs-6">Select Response Type</td>
                        <td>
                            <select name="responsetype" id="" class="form-control  "  style="background-color: transparent; color:black;border: 1px groove black">
                                <option selected>--Select Responsetype--</option>
                                <option value="feedback">Feedback</option>
                                <option value="complain">Complain</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td class="fs-6">Enter Subject</td>
                        <td><input type="" name="subject" id="" class="form-control"  style=" background-color: white; color:black;"></td>
                    </tr>
                    <tr>
                        <td class="fs-6">Enter ResponseText</td>
                        <td><textarea name="responsetext" id="" cols="" rows="" class="form-control  "
                                style="height: 120px; background-color: white; color:black;"></textarea></td>
                    </tr>
                    <tr>
                        <td>&nbsp;</td>
                        <td> <button class="btn btn-outline-light " style="background-color:  #192f59;;" type="submit">Submit</button></td>
                    </tr>
                    

                </table>

            </form>

        </div>


    </div>







</div>


{% endblock body %}
