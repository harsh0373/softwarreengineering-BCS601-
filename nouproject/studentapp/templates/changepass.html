{% extends "studentparent.html" %}

{% block body  %}
{% if messages %}
  {% for msg in messages %}

  <div class="alert alert-danger alert-dismissible fade show" role="alert">
    <strong>Hey bro!</strong> {{msg}}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  {%  endfor %}
  

{%  endif %}

  
<div class="container-fluid m-0 p-0">
    <div class="row m-0 p-0 mt-5">
        <div class="col-4"></div>
        <div class="col-6">
            <h2 style="color:lightskyblue; margin: auto;" class="text-center bg-primary w-100 py-3 ">Change password </h2>
            <form action="{% url 'studentapp:changepass'%}" class="form-group" method="post">
                {% csrf_token %}
                <table class="table">
                    <tr>
                        <td>Enter Old Password</td>
                        <td><input type="password" name="oldpassword" class="form-control bg-light" required></td>
                    </tr>
                    <tr>
                        <td>Enter New Password</td>
                        <td><input type="password" name="newpassword" class="form-control bg-light" required></td>
                    </tr>

                    <tr>
                        <td>Confirm New Password</td>
                        <td><input type="password" name="cnewpassword" class="form-control bg-light" required></td>
                    </tr>
                    <tr>
                        <td>&nbsp;</td>
                        <td><input type="submit" value="Submit" class="form-group btn btn-primary " required></td>
                    </tr>


                </table>


            </form>
        </div>
    </div>






</div>







{% endblock %}
