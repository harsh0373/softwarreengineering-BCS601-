{% extends "adminparent.html" %}
{% block body %}
    <div class="row">
        <div class="col-sm-12">
            <h1 style="text-align:center;">All Study Material</h1>   


            <table class="table table-bordered text-center  text-light" >
                <tr>
                    <th class="text">A#</th>
                    
                    <th>Program</th>
                    <th>Branch</th>
                    <th>Year</th>
                    <th>Subject</th>
                    
                    <th>Filename</th>
                    <th>Download</th>
                    <th>Delete File</th>

                </tr>
                {% for m in mt %}
                <tr>
                    <td>{{forloop.counter}}</td>
                    <td>{{m.program}}</td>
                    <td>{{m.branch}}</td>
                    <td>{{m.year}}</td>
                    <td>{{m.subject}}</td>
                    <td>{{m.file_name}}</td>
                    
                    <td>
                        <a target="_blank" href="{{m.my_file.url}}">{{m.my_file}}</a>
                       </td>
                       <td><a href="{% url 'adminapp:deletematerial' ids=m.ids %}">Delete</a></td>
                    
                    
        
        
                </tr>
                {% endfor %}
            </table>
              
        </div>
    </div>
{% endblock body %}
