{% extends "adminparent.html" %}
{% block body %}
<div class="row">
    <div class="col-sm-12">
        <h1 style="text-align:center;">Manage Centers & Coarses</h1>   

</div>
</div>
<div class="col-md-12">
    <form action="{% url 'adminapp:centers' %}" method="post">
        {% csrf_token %}
    <label for="validationCustom05" class="form-label ">Centers:</label>
    <textarea name="center" class="form-control text-light" placeholder="Add Center" style="opacity: 0.8"></textarea>
    <div class="col-12 mb-5">
        <a href="{% url 'adminapp:viewcenter' %}"><button class="btn mx-2 mt-3" style="background-color:#3db166; float: right;" type="button" onclick="block2()" id="center"> See Centers</button></a>
        <button class="btn  px-4 mt-3" type="submit" style="background-color:#3db166; float: right;">Add</button>
    </div>  
    </form>

   
</div>
<div class="col-md-12">
    <form action="{% url 'adminapp:coarses' %}" method="post">
        {% csrf_token %}
    <label for="validationCustom05" class="form-label ">Coarses:</label>
    <textarea name="coarse" class="form-control text-light" placeholder="Add Coarses" style="opacity: 0.8"></textarea>
    <div class="col-12 mb-5">
        <button class="btn mx-2 mt-3" style="background-color:#3db166; float: right;" type="button" onclick="block()" id="coarses"> See Coarses</button>
        <button class="btn  px-4 mt-3" type="submit" style="background-color:#3db166; float: right;">Add</button>
    </div>
    </form>
   
    
</div>
<div class="row">
<div class="col-6 text-light" id="coarse">
    <table>
        <tr>
            <th>
                Id#
            </th>
            <th>
                Coarse
            </th>
            <th>
                Delete Coarse
            </th>
        </tr>
        {% for c in coarse %}
        <tr class="text-light">
            <td >{{c.id_s1}}</td>
            <td >{{c.coarse}}</td>
            <td ><a href="{% url 'adminapp:deletecoarse' id_s1=c.id_s1  %}">Delete</a></td>
        </tr>
        {% endfor %}
    </table>
</div>
</div>
<style>
    #coarse{
        display: none;
    }
   
</style>
<script>

    function block()
        {
        
       var a= document.getElementById('coarses').innerHTML
       if (a=='See Coarses')

       {
        document.getElementById('coarse').style.display="block";
        document.getElementById('coarses').innerHTML="Hide Coarses"

       }
       else{
        document.getElementById('coarse').style.display="none";
        document.getElementById('coarses').innerHTML="See Coarses"
       }
        
  


        }
    
</script>
{% endblock body %}
