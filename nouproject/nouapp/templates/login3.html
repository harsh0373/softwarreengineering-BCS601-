{% extends "parent2.html" %}
{% block main3 %}
{% if messages %}
         {% for message in messages %}
         <div class="alert alert-warning alert-dismissible fade show" role="alert">
            <strong>{{message}}</strong> 
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
          {% endfor %}
{% endif %}
<script>
    function validate()
    {
        var userid=document.getElementById("userid");
        var password=document.getElementById("password");
        if (userid.velue=="" || userid.value==null)
        {
            alert('Please enter userid');
            userid.focus();
        }
        else if (password.value=="" || password.value==null)
        {
            alert('Please enter password');
            password.focus();
        }
        else{
            document.getElementById("frmlogin").submit()
        }
    }
</script>
<h2 style="text-align: center;">Login Page</h2>
<form class="form-group mb-5 py-5" id="frmlogin" method="post" action="{% url 'nouapp:login' %}" onsubmit="event.preventDefault();validate();">
    {% csrf_token %}
    <table class="form-group" style="margin: auto; width: 60%;">
        <tr>
            <td>Enter UserId Roll No</td>
            <td>
                <input type="text" name="userid" class="form-control" id="userid"/>
            </td>
        </tr>
        <tr>
            <td>Enter your Password</td>
            <td>
                <input type="password" name="password" class="form-control" id="password"/>
            </td>
        </tr>
        <tr>
            <td>Select Usertype</td>
            <td>
                <select name="usertype" class="form-control">
                    <option selected>-Select Usertype-</option>
                    <option value="Student">Student</option>
                    <option value="admin">Admin</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>&nbsp;</td>
            <td>
                <button type="submit" class="btn btn-success">Login</button>
            </td>
        </tr>
    </table>
</form>
{% endblock main3 %}
